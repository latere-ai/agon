name: release

# Tag-triggered CLI release via the central reusable pipeline (latere-ai/ci):
# lint -> test -> goreleaser, driven by this repo's .goreleaser.yaml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/cli-release.yml@v1
    secrets: inherit
